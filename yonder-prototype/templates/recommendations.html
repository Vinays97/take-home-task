<!DOCTYPE html>
<html>
<head>
    <title>Recommendations</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            padding: 20px;
            background-color: #f5f5f5;
            font-family: 'Arial', sans-serif;
        }
        .container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            width: 80%;
            max-width: 100%;
            align-items: flex-start;
        }
        .box {
            width: 48%;
            padding: 20px;
            margin-bottom: 20px;
            background-color: white;
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .box p {
            flex-grow: 1;
            display: inline-block;
        }
        .box p.typing {
            width: 0;
        }
        .box h2 {
            margin-bottom: 10px;
        }
        .box:hover {
            transform: translateY(-5px);
        }
        h2 {
            color: #333;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            line-height: 1.6;
        }
        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }
        @keyframes blink-caret {
            from, to { border-color: transparent; }
            50% { border-color: black; }
        }
        .typing {
            overflow: hidden;
            white-space: nowrap;
            border-right: 3px solid black;
            animation: typing 3.5s steps(40, end), blink-caret .75s step-end infinite;
        }
        @keyframes fadeInOutLetter {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }
        .fade-letter {
            display: inline-block;
            animation: fadeInOutLetter 2s infinite;
        }
        .fade-container {
            display: flex;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="prompt-box">
            <h2>Prompt</h2>
            <p id="prompt-text" class="fade-container"></p>
        </div>
        <div class="box" id="recommendations-box">
            <h2>Recommendations</h2>
            <p id="recommendations-text" class="fade-container"></p>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const userId = "{{ user_id }}";
            const promptElement = document.getElementById("prompt-text");
            const recommendationsElement = document.getElementById("recommendations-text");

            function typeText(element, text) {
                element.innerHTML = '';
                const words = text.split(' ');
                let i = 0;
                const interval = setInterval(() => {
                    if (i < words.length) {
                        element.innerHTML += words.slice(i, i + 15).join(' ') + ' ';
                        i += 15;
                    } else {
                        clearInterval(interval);
                    }
                }, 30);
            }

            function fadeInOutLetters(element, text) {
                element.innerHTML = '';
                for (let i = 0; i < text.length; i++) {
                    const span = document.createElement('span');
                    span.className = 'fade-letter';
                    span.style.animationDelay = `${i * 0.1}s`;
                    span.textContent = text[i];
                    element.appendChild(span);
                }
            }

            fadeInOutLetters(promptElement, 'Generating...');
            fadeInOutLetters(recommendationsElement, 'Thinking...');

            fetch(`/recommendations/${userId}/prompt`)
                .then(response => response.text())
                .then(data => {
                    typeText(promptElement, data);
                });

            fetch(`/recommendations/${userId}/details`)
                .then(response => response.text())
                .then(data => {
                    recommendationsElement.classList.remove('fade-container');
                    typeText(recommendationsElement, data);
                });
        });
    </script>
</body>
</html>
